[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flowfixer-eda"
version = "0.1.0"
description = "Tool-feedback-augmented diagnosis and repair for RTL-to-GDS flows"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "FlowFixer-EDA authors"}]
dependencies = []

[project.scripts]
flowfixer-eda = "flowfixer_eda.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
